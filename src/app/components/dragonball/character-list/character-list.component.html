<h3>{{listName()}}</h3>
@if (visibleCharacters().length > 0) {
  <ul>
    @for (character of visibleCharacters(); track character.id; let idx = $index) {
      <li>
        <span>{{idx + 1}} {{character.name}}</span>
        <strong
          [class.text-danger]="character.power > 9000"
          [class.text-primary]="character.power < 9000"
        >
          ({{character.power}})
        </strong>
      </li>
    }
  </ul>
} @else {
  <p><strong>Aquí no hay nadie</strong></p>
}
